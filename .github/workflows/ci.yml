name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gastos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gastos_test
      JWT_SECRET: secreto_solo_para_ci

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        run: npx prisma generate

      - name: Compilar el proyecto
        run: npm run build

      - name: Ejecutar pruebas unitarias
        run: npm run test

      - name: Aplicar migraciones en la base de datos de pruebas
        run: npx prisma migrate deploy

      - name: Ejecutar pruebas e2e
        run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v6

      - name: Construir la imagen Docker
        run: docker build -t gastos-api .
